<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Saiyan deploy mode</title>
  <desc id="desc">Animated fan-made pixel art tribute showing two Saiyan-inspired fighters powering up around a glowing code sphere.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset=".5" stop-color="#172554"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop stop-color="#fff"/>
      <stop offset=".3" stop-color="#67e8f9"/>
      <stop offset=".7" stop-color="#7c3aed" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <style>
    * { shape-rendering: crispEdges; }
    .aura-left { animation: aura-left .75s steps(2,end) infinite; transform-origin: 225px 125px; }
    .aura-right { animation: aura-right .68s steps(2,end) infinite; transform-origin: 675px 125px; }
    .fighter-left { animation: hover-left 1.15s steps(2,end) infinite; }
    .fighter-right { animation: hover-right 1.05s steps(2,end) infinite; }
    .orb { animation: orb 1.1s steps(3,end) infinite; transform-origin: 450px 120px; }
    .beam { animation: beam .8s steps(2,end) infinite; }
    .spark { animation: spark 1.4s linear infinite; }
    .spark.s2 { animation-delay: -.45s; }
    .spark.s3 { animation-delay: -.9s; }
    .code { animation: code 2.2s steps(4,end) infinite; }
    .meter { animation: meter 2s steps(9,end) infinite; }
    @keyframes aura-left { 50% { transform: scale(1.08,.95); opacity:.7; } }
    @keyframes aura-right { 50% { transform: scale(.94,1.08); opacity:.72; } }
    @keyframes hover-left { 50% { transform: translateY(-4px); } }
    @keyframes hover-right { 50% { transform: translateY(3px); } }
    @keyframes orb { 50% { transform: scale(1.18); opacity:.82; } }
    @keyframes beam { 50% { opacity:.25; } }
    @keyframes spark { from { transform: translateY(35px); opacity:0; } 25% {opacity:1;} to { transform: translateY(-85px); opacity:0; } }
    @keyframes code { 50% { transform: translateY(-8px); opacity:.45; } }
    @keyframes meter { from { width:0; } to { width:294px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="900" height="220" rx="16" fill="url(#sky)"/>
  <circle cx="450" cy="110" r="170" fill="url(#sun)" opacity=".25"/>
  <path d="M0 172L85 143l73 19 83-31 91 31 94-21 88 23 81-38 104 36 92-28 99 36v50H0z" fill="#020617"/>
  <path d="M0 184L100 161l62 19 83-24 90 25 93-16 93 20 87-25 83 22 107-21 102 24v35H0z" fill="#0f172a"/>
  <rect width="900" height="220" rx="16" fill="url(#scan)"/>

  <!-- left golden aura -->
  <g class="aura-left" fill="#fde047" opacity=".48">
    <path d="M176 172l9-38-12-7 19-21-7-17 22-17 4-25 15 18 12-31 9 32 19-18 1 27 22 15-11 19 17 22-16 10 8 31z"/>
    <rect x="182" y="95" width="7" height="32"/><rect x="269" y="80" width="6" height="27"/>
  </g>

  <!-- right blue aura -->
  <g class="aura-right" fill="#38bdf8" opacity=".45">
    <path d="M626 173l8-32-16-12 20-19-8-20 23-13 3-30 18 19 12-32 10 31 19-16 3 27 24 13-12 20 20 18-17 15 9 31z"/>
    <rect x="620" y="77" width="7" height="29"/><rect x="716" y="98" width="6" height="31"/>
  </g>

  <!-- Goku-inspired pixel fighter -->
  <g class="fighter-left">
    <g fill="#facc15">
      <path d="M211 62h8V48h8v-16h9v20h8V38h8v22h10v17h-51z"/>
      <rect x="204" y="58" width="12" height="16"/><rect x="260" y="57" width="11" height="18"/>
    </g>
    <path d="M215 74h49v35h-49z" fill="#f4b183"/>
    <path d="M215 74h10v13h-10zm39 0h10v13h-10z" fill="#ca7f5b"/>
    <rect x="225" y="86" width="8" height="5" fill="#0f172a"/><rect x="247" y="86" width="8" height="5" fill="#0f172a"/>
    <rect x="233" y="99" width="15" height="4" fill="#7c2d12"/>
    <path d="M207 109h64v54h-64z" fill="#f97316"/>
    <path d="M229 109h21v54h-21z" fill="#1d4ed8"/>
    <path d="M194 115h15v44h-15zm77 0h15v44h-15z" fill="#f4b183"/>
    <path d="M205 160h29v39h-20v-25h-9zm40 0h30v14h-9v25h-21z" fill="#f97316"/>
    <path d="M212 190h25v12h-31zm28 0h28l8 12h-36z" fill="#1d4ed8"/>
    <rect x="205" y="147" width="15" height="9" fill="#1d4ed8"/><rect x="270" y="147" width="15" height="9" fill="#1d4ed8"/>
  </g>

  <!-- Vegeta-inspired pixel fighter -->
  <g class="fighter-right">
    <path d="M648 70h8V43h8V23l10 25 10-35 10 35 11-25v22h9v27z" fill="#e0f2fe"/>
    <path d="M647 71h68v37h-68z" fill="#efb08b"/>
    <path d="M647 71h12v13h-12zm56 0h12v13h-12z" fill="#b9684d"/>
    <rect x="659" y="84" width="10" height="5" fill="#0f172a"/><rect x="693" y="84" width="10" height="5" fill="#0f172a"/>
    <rect x="674" y="98" width="17" height="4" fill="#7c2d12"/>
    <path d="M643 108h76v56h-76z" fill="#1d4ed8"/>
    <path d="M651 108h60v38h-60z" fill="#f8fafc"/>
    <rect x="660" y="116" width="42" height="22" fill="#fbbf24"/>
    <path d="M628 112h15v48h-15zm91 0h15v48h-15z" fill="#f8fafc"/>
    <rect x="628" y="148" width="15" height="10" fill="#e0f2fe"/><rect x="719" y="148" width="15" height="10" fill="#e0f2fe"/>
    <path d="M649 162h27v39h-23zm37 0h27l-4 39h-23z" fill="#1d4ed8"/>
    <path d="M646 188h31v14h-36zm39 0h31l6 14h-37z" fill="#f8fafc"/>
  </g>

  <!-- energy exchange -->
  <g class="beam" fill="#67e8f9">
    <rect x="290" y="116" width="126" height="5"/><rect x="484" y="116" width="138" height="5"/>
    <rect x="326" y="126" width="90" height="3"/><rect x="484" y="126" width="101" height="3"/>
  </g>
  <g class="orb" filter="url(#glow)">
    <rect x="426" y="96" width="48" height="48" fill="#7c3aed" opacity=".65"/>
    <rect x="434" y="88" width="32" height="64" fill="#38bdf8" opacity=".75"/>
    <rect x="418" y="104" width="64" height="32" fill="#38bdf8" opacity=".75"/>
    <rect x="438" y="108" width="24" height="24" fill="#fff"/>
    <text x="450" y="126" text-anchor="middle" font-family="monospace" font-size="18" font-weight="900" fill="#0f172a">{ }</text>
  </g>

  <!-- floating code and sparks -->
  <g font-family="monospace" font-weight="700" font-size="15" fill="#a5f3fc" opacity=".78">
    <text class="code" x="335" y="65">npm run build</text>
    <text class="code" x="500" y="70">git push</text>
  </g>
  <g fill="#fde047">
    <rect class="spark" x="155" y="135" width="5" height="11"/><rect class="spark s2" x="299" y="150" width="4" height="9"/><rect class="spark s3" x="244" y="128" width="5" height="10"/>
  </g>
  <g fill="#67e8f9">
    <rect class="spark s2" x="606" y="143" width="5" height="11"/><rect class="spark s3" x="751" y="151" width="4" height="9"/><rect class="spark" x="684" y="132" width="5" height="10"/>
  </g>

  <!-- power meter -->
  <rect x="303" y="188" width="294" height="9" rx="2" fill="#1e293b" stroke="#475569"/>
  <rect class="meter" x="303" y="188" height="9" rx="2" fill="#a78bfa"/>
  <text x="450" y="211" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#e2e8f0">DEPLOYMENT POWER LEVEL: OVER 9000</text>
</svg>
